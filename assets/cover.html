<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>說姓名，轉分機 — dial-by-name 內部流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-paper:  #f3ede3;
      --color-ink:    #232a26;
      --color-muted:  #4f5a54;
      --font-sans:  'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .frame { max-width: 1280px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    svg { min-width: 1280px; width: 100%; height: auto; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }

<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title cover-desc">
        <title id="cover-title">說姓名，轉分機 — dial-by-name 內部流程</title>
        <desc id="cover-desc">FreePBX 電話層錄音後由 FastAGI 轉錄，決策核心比對名冊拼音並依固定規則順序產生 Decision，再由 dialplan 執行轉接。</desc>

        <rect width="100%" height="100%" fill="#f3ede3"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <text x="512" y="594" text-anchor="middle" fill="#232a26" font-size="16" font-weight="600"
